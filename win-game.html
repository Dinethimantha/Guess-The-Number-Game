<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Number Game</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <div class="game-container">

        <div class="game-card">

            <!-- Game Icon -->

            <div class="game-icon">
                🎮
            </div>

            <!-- Game Title -->

            <h1>Guess The Number</h1>

            <p class="subtitle">
                Can you guess the secret number?
            </p>

            <div class="range-info">
                <span>Guess a number between</span>
                <strong>1 - 100</strong>
            </div>

            <!-- Attempts Section -->

            <div class="attempt-section">

                <div class="attempt-text">
                    <span>Remaining Attempts</span>
                    <strong id="attempts">10 / 10</strong>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress"></div>
                </div>

            </div>

            <!-- Input Section -->

            <div class="input-section">

                <label for="guess">Enter Your Guess</label>

                <input
                    type="number"
                    id="guess"
                    placeholder="Enter a number (1 - 100)"
                    min="1"
                    max="100"
                >

            </div>

            <!-- Buttons -->

            <div class="button-section">

                <button class="guess-btn" id="guessBtn" onclick="checkGuess()">
                    Guess Number
                </button>

                <button class="restart-btn" onclick="restartGame()">
                    ↻ Restart
                </button>

            </div>

            <!-- Message Section -->

            <div class="message-box" id="message">

                <span class="message-icon">💡</span>

                <span id="messageText">
                    Good luck! Enter your first guess.
                </span>

            </div>

            <!-- Game Statistics -->

            <div class="game-stats">

                <div class="stat-box">
                    <span class="stat-icon">🎯</span>
                    <div>
                        <small>Total Attempts</small>
                        <h3 id="usedAttempts">0</h3>
                    </div>
                </div>

                <div class="stat-box">
                    <span class="stat-icon">⭐</span>
                    <div>
                        <small>Game Status</small>
                        <h3 id="gameStatus">Playing</h3>
                    </div>
                </div>

            </div>

            <div class="footer">
                Guess Smart. Have Fun!
            </div>

        </div>

    </div>


    <script>

        // Generate a random number between 1 and 100

        let randomNumber = Math.floor(Math.random() * 100) + 1;


        // Game variables

        let attempts = 0;

        let maxAttempts = 10;

        let gameover = false;


        // Check Guess Function

        function checkGuess() {

            if (gameover) {

                showMessage(
                    "Please restart the game to play again!",
                    "warning",
                    "⚠️"
                );

                return;
            }


            let guess = Number(document.getElementById("guess").value);


            // Validate input

            if (
                document.getElementById("guess").value === "" ||
                !Number.isInteger(guess) ||
                guess < 1 ||
                guess > 100
            ) {

                showMessage(
                    "Please enter a valid number between 1 and 100!",
                    "warning",
                    "⚠️"
                );

                return;
            }


            // Increase attempts

            attempts++;


            // Update attempts

            updateAttempts();


            // Correct Guess

            if (guess === randomNumber) {

                gameover = true;

                showMessage(
                    "Congratulations! You Won! You guessed the correct number!",
                    "success",
                    "🎉"
                );

                document.getElementById("gameStatus").innerText = "Won";

                document.getElementById("guessBtn").disabled = true;

                document.getElementById("guess").disabled = true;

                return;

            }


            // Check if the guess is close

            let difference = Math.abs(randomNumber - guess);


            if (difference <= 5) {

                showMessage(
                    "Very Close! You are almost there!",
                    "close",
                    "🔥"
                );

            }

            else if (guess > randomNumber) {

                showMessage(
                    "Too High! Try a smaller number.",
                    "high",
                    "📉"
                );

            }

            else {

                showMessage(
                    "Too Low! Try a bigger number.",
                    "low",
                    "📈"
                );

            }


            // Check Game Over

            if (attempts >= maxAttempts) {

                gameover = true;

                showMessage(
                    "Game Over! You Lost! The correct number was " + randomNumber,
                    "danger",
                    "❌"
                );

                document.getElementById("gameStatus").innerText = "Lost";

                document.getElementById("guessBtn").disabled = true;

                document.getElementById("guess").disabled = true;

            }

        }



        // Display Message Function

        function showMessage(text, type, icon) {

            let messageBox = document.getElementById("message");

            messageBox.className = "message-box " + type;

            document.getElementById("messageText").innerText = text;

            document.querySelector(".message-icon").innerText = icon;

        }



        // Update Attempts and Progress Bar

        function updateAttempts() {

            let remaining = maxAttempts - attempts;

            document.getElementById("attempts").innerText =
                remaining + " / " + maxAttempts;

            document.getElementById("usedAttempts").innerText = attempts;


            let percentage = (remaining / maxAttempts) * 100;

            document.getElementById("progress").style.width =
                percentage + "%";

        }



        // Restart Game Function

        function restartGame() {

            randomNumber = Math.floor(Math.random() * 100) + 1;

            attempts = 0;

            gameover = false;


            // Reset Input

            document.getElementById("guess").value = "";

            document.getElementById("guess").disabled = false;


            // Enable Guess Button

            document.getElementById("guessBtn").disabled = false;


            // Reset Game Information

            document.getElementById("gameStatus").innerText = "Playing";

            updateAttempts();


            // Show Restart Message

            showMessage(
                "New Game Started! Good Luck!",
                "success",
                "🚀"
            );


        }



        // Press Enter to Guess

        document.getElementById("guess").addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                checkGuess();

            }

        });

    </script>

</body>

</html>
